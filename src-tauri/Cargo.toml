[package]
name = "clippad"
version = "0.1.0"
description = "ClipPad — open-source clipboard history manager"
authors = ["G Mahesh"]
license = "MIT"
repository = "https://github.com/Maheshoo7/clippad"
homepage = "https://github.com/Maheshoo7/clippad"
readme = "../README.md"
edition = "2021"
publish = false

[lib]
name = "clippad_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "image-png", "tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-global-shortcut = "2"
tauri-plugin-store = "2"
tauri-plugin-autostart = "2"
clipboard-rs = "0.3"
base64 = "0.23"
rusqlite = { version = "0.43.0", features = ["bundled"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-service-management = { version = "0.3", features = ["SMAppService"] }
