name: 🐛 Bug report
description: Something isn't working the way it should.
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this! 🐈

        ⚠️ **Please don't paste real clipboard contents, passwords or personal data** — use a made-up example.
        Found a security issue? Report it privately instead: see [SECURITY.md](https://github.com/Maheshoo7/clippad/blob/main/SECURITY.md).

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
      placeholder: When I copy an image from Preview, it doesn't appear in the list…
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open Preview and copy part of an image
        2. Press ⌘⇧V
        3. …
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: ClipPad version
      placeholder: "0.1.0"
    validations:
      required: true

  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: "macOS 15.3"
    validations:
      required: true

  - type: dropdown
    id: chip
    attributes:
      label: Mac type
      options:
        - Apple Silicon (M1 or later)
        - Intel
    validations:
      required: true

  - type: dropdown
    id: install
    attributes:
      label: How did you install ClipPad?
      options:
        - Downloaded DMG from GitHub Releases
        - Built from source
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: Screenshots, recordings or logs
      description: Anything else that helps. You can drag images in here.
